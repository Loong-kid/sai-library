<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf0ed">
  <meta name="description" content="책과 나 사이, 조용히 이야기를 읽는 개인 서재. 영어 소설을 편안한 전자책으로 만나보세요.">
  <title>사이, 서재 — 책과 나 사이</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip">본문으로 건너뛰기</a>
  <div id="library">
    <header class="site-header wrap">
      <a class="brand" href="#" aria-label="사이, 서재 홈"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 8h9c3 0 4 2 4 4v17c-1-2-3-3-6-3H5zm26 0h-9c-3 0-4 2-4 4v17c1-2 3-3 6-3h7z"/></svg><span>사이, 서재</span></a>
      <button id="library-theme" class="quiet" aria-label="밤 모드로 전환"></button>
    </header>
    <main id="main" class="wrap">
      <section class="welcome" aria-labelledby="welcome-title">
        <div><p class="intro">책과 나 사이, 조용한 시간</p><h1 id="welcome-title">오늘은 어떤 이야기를<br>펼쳐볼까요?</h1></div>
        <p class="welcome-note">한 장씩, 나만의 속도로.<br>잠시 머물러 읽기 좋은 작은 서재입니다.</p>
      </section>
      <section id="resume-section" hidden aria-label="최근 읽던 책"></section>
      <section class="shelf" aria-labelledby="shelf-title">
        <div class="shelf-top"><div class="shelf-title"><h2 id="shelf-title">나의 책장</h2><span id="book-count">2권</span></div><label class="search-box"><span class="sr-only">책 제목 또는 작가 검색</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="library-search" type="search" placeholder="제목, 작가로 찾기" autocomplete="off"></label></div>
        <div class="filter-row" role="group" aria-label="책장 보기"><button data-filter="all" class="filter active" aria-pressed="true">모든 책</button><button data-filter="reading" class="filter" aria-pressed="false">읽고 있는 책</button><button data-filter="marked" class="filter" aria-pressed="false">책갈피 있는 책</button></div>
        <div id="books-grid" class="books-grid" aria-live="polite"><p class="load-note">책장을 불러오고 있습니다…</p></div>
      </section>
    </main>
    <footer class="site-footer wrap"><p>이야기는 여기서, 언제든 이어집니다.</p><p>읽던 위치는 이 브라우저에 저장됩니다.</p></footer>
  </div>
  <section id="reader" hidden aria-label="전자책 읽기">
    <header class="reader-header"><button id="back-library" class="quiet"><span aria-hidden="true">←</span><span>책장</span></button><div class="reading-title"><span id="reader-book"></span><span id="reader-group"></span></div><div class="reader-actions"><button id="toc-open" class="icon-button" aria-label="목차 열기" title="목차"></button><button id="bookmark-toggle" class="icon-button" aria-label="책갈피 추가" title="책갈피"></button><button id="settings-open" class="icon-button" aria-label="독서 설정 열기" title="독서 설정">Aa</button></div></header>
    <div id="reading-surface"><div id="page-viewport"><article id="prose" class="prose" lang="en" aria-label="소설 본문" tabindex="-1"></article></div></div>
    <footer class="reader-footer"><div class="chapter-nav"><button id="prev-chapter" class="quiet" aria-label="이전 장">← <span>이전 장</span></button><span id="chapter-label"></span><button id="next-chapter" class="quiet" aria-label="다음 장"><span>다음 장</span> →</button></div><div class="page-control"><button id="prev-page" class="icon-button" aria-label="이전 페이지">‹</button><span id="page-label"></span><button id="next-page" class="icon-button" aria-label="다음 페이지">›</button></div><div class="book-progress"><div><span id="progress-label"></span><span id="save-label">읽던 위치 자동 저장</span></div><div class="progress-track"><span id="progress-bar"></span></div></div></footer>
  </section>
  <dialog id="toc-dialog" class="toc-dialog" aria-labelledby="toc-title"><div class="dialog-top"><h2 id="toc-title">책 속으로</h2><button class="icon-button close-dialog" aria-label="닫기">×</button></div><div class="toc-tabs" role="group" aria-label="책 탐색"><button data-tab="contents" class="filter active" aria-pressed="true">목차</button><button data-tab="bookmarks" class="filter" aria-pressed="false">책갈피</button><button data-tab="search" class="filter" aria-pressed="false">본문 검색</button></div><label class="dialog-search"><span id="toc-search-label">목차에서 찾기</span><input id="toc-search" type="search" placeholder="장 제목을 입력하세요" autocomplete="off"></label><div id="toc-results" class="toc-results" aria-live="polite"></div></dialog>
  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title"><div class="dialog-top"><h2 id="settings-title">나에게 맞는 독서</h2><button class="icon-button close-dialog" aria-label="닫기">×</button></div><fieldset><legend>배경</legend><div class="option-row"><button data-theme="light" class="theme-option">낮</button><button data-theme="sepia" class="theme-option">종이</button><button data-theme="dark" class="theme-option">밤</button></div></fieldset><fieldset><legend>글자 크기</legend><div class="size-control"><button id="font-smaller" class="quiet" aria-label="글자 작게">A−</button><output id="font-size-label">21px</output><button id="font-larger" class="quiet" aria-label="글자 크게">A+</button></div></fieldset><fieldset><legend>글꼴</legend><div class="option-row"><button data-font="serif">세리프</button><button data-font="sans">산세리프</button></div></fieldset><fieldset><legend>읽기 방식</legend><div class="option-row"><button data-mode="pages">페이지 넘기기</button><button data-mode="scroll">스크롤</button></div></fieldset><p class="settings-hint">페이지 넘기기: ← → 방향키 또는 화면 밀기<br>책갈피: B · 목차: T · 설정: A</p></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
